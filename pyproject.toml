[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "logsentinel"
version = "1.0.0"
description = "Detect brute force and web attacks in SSH and Apache/Nginx logs"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
logsentinel = "logsentinel.cli:main"

[tool.setuptools]
packages = ["logsentinel"]
